name: Rotation atlas validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  math-and-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source registry
        run: python scripts/validate_evidence.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check rotation lab JavaScript syntax
        run: node --check assets/rotation-lab.js
      - name: Smoke test browser controls and evidence browser
        run: node tests/smoke_rotation_lab.cjs
