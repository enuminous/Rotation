name: Rotation atlas validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  math-and-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source registry
        run: python scripts/validate_evidence.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check rotation lab JavaScript syntax
        run: node --check assets/rotation-lab.js
      - name: Smoke test browser controls and evidence browser
        run: node tests/smoke_rotation_lab.cjs
  exact-gr-godel:
    name: Classical Gödel Einstein-tensor symbolic control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic dependency
        run: python -m pip install sympy==1.14.0
      - name: Recompute Gödel Ricci and Einstein tensor
        run: python research/rot004_godel_sympy.py
  exact-gr-ko-rot005:
    name: ROT-005 expanding causal rotating Einstein spacetime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic dependency
        run: python -m pip install sympy==1.14.0
      - name: Recompute Einstein tensor, vorticity, causality and WEC
        run: python research/rot005_ko_sympy.py
      - name: Check ROT-006 source-first matter action exclusions
        run: python research/rot006_scalar_source_test.py
      - name: ROT-007 exact Einstein-scalar-Maxwell trace obstruction
        run: python research/rot007_einstein_scalar_maxwell.py
